<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Aura Goal - Manifest Your Life</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .glow {
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(255,215,0,0.2) 0%, transparent 70%);
      animation: pulse 3s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }
    .content {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.5rem;
      color: #FFD700;
      margin-bottom: 40px;
      letter-spacing: 2px;
    }
    button {
      background: linear-gradient(90deg, #FFD700, #FFA500);
      color: #000;
      font-weight: 800;
      font-size: 1.2rem;
      padding: 16px 50px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s;
      box-shadow: 0 0 30px rgba(255,215,0,0.4);
    }
    button:hover { transform: scale(1.05); }
    @media (max-width: 768px) {
      h1 { font-size: 2rem; }
      p { font-size: 1.2rem; }
    }
  </style>

  <div class="glow"></div>
  <div class="content">
    <h1>THE AURA GOAL</h1>
    <p>Manifest Your Life</p>
    <button>Enter</button>
  </div>
